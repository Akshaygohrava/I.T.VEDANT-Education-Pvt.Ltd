<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login & Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            min-height: 100vh;
            background-color: #ffffff;
        }

        .card-box {
            width: 100%;
            max-width: 350px;
            padding: 30px;
            border-radius: 6px;
        }

        .action-btn {
            padding: 6px 22px;
            font-size: 16px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<h3><a class="text-decoration-none p-2 mt-5 ms-5 text-center" href="./home.html">Home</a></h3>
<div class="container py-5">
    <div class="d-flex flex-column align-items-center gap-4">

       
        <div class="card shadow card-box">
            <h3 class="text-center mb-4">Login</h3>

            <form>
                <div class="mb-3">
                    <label class="form-label">Username:</label>
                    <input type="text" class="form-control" placeholder="Enter username">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password:</label>
                    <input type="password" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary action-btn">
                    Login
                </button>
                <p class="mt-3">Not a User? <a class="text-decoration-none" href="./registration.html"><span class="text-primary">Register</span></a></p>
            </form>
        </div>

        
        <div class="card shadow card-box">
            <h3 class="text-center mb-4">Registration</h3>

            <form>
                <div class="mb-3">
                    <label class="form-label">Username:</label>
                    <input type="text" class="form-control" placeholder="Enter username">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Id:</label>
                    <input type="email" class="form-control" placeholder="Enter a valid email address">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password:</label>
                    <input type="password" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password:</label>
                    <input type="password" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary action-btn">
                    Register
                </button>
                <p class="mt-3">Already User? <a class="text-decoration-none" href="./login.html"><span class="text-primary">Login</span></a></p>
            </form>
        </div>

    </div>
</div>



</body>
</html>
