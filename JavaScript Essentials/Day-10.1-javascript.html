<!doctype html>
<html lang="en">
    <head>
        <title>Bootstrap5 with Javascript !</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <h1 class="text-center text-danger bg-primary p-3">Hello Bootstrap Form with JS</h1>
        </header>
       
        <main class="m-4">
            <form>
                <div class="mb-3">
                <label for="" class="form-label">Name</label>
                <input
                    type="text"
                    class="form-control"
                    name=""
                    id="input"
                    aria-describedby="helpId"
                    placeholder=""
                />
                <label for="" class="form-label">Number</label>

                <input
                    type="number"
                    class="form-control"
                    name=""
                    id="inputbox1"
                    aria-describedby="helpId"
                    placeholder=""
                />
                <small id="helpId" class="form-text text-muted">check if your number is prime or not </small>
            </div>
            <button
                type="button"
                class="btn btn-primary"
                onclick="checkPrime()"
            >
              Submit
            </button>
                <p class="text-mute">check the number is prime or not !</p>
              <br><br>

                <p  class="bg-warning" id="primePara">Number is Prime or Not :</p>

                <p>Write a function and logic to check weather Input Number Is prime or not</p>
                
            </div>
            </form>
            

        </main>


        <script src="./Javascript/Day-10.1-javascript.js"></script>

        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
