        <title>Input Calculator</title>

            name="viewport"

        />

        <!-- Bootstrap CSS v5.2.1 -->

            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"

    <body>
        <header>
            <h1 class="bg-primary text-center text-danger mb-3 p-3">Input type Calculator !</h1>
        </header>
        <main class="m-4">
            <form>
               <div class="mb-3">
                <label for="" class="form-label">Input 1</label>
                <input
                    type="number"
                    class="form-control text-lg-center"
                    name=""
                    id="input1"
                    aria-describedby="helpId"
                    placeholder=""
                />
                <div class="mb-3">
                <label for="" class="form-label">Input 2</label>
                <input
                    type="number"
                    class="form-control text-lg-center"
                    name=""
                    id="input2"
                    aria-describedby="helpId"
                    placeholder=""
                />
            </div>
            <h2 class="bg-info p-3 mb-4" id="output">Output :</h2>
           
            </form>
             <div class="d-flex flex-wrap justify-content-evenly align-content-center">
                <button type="button" class="btn btn-outline-danger" onclick="add()">Addition</button>
                <button type="button" class="btn btn-outline-primary" onclick="sub()">Subtraction</button>
                <button type="button" class="btn btn-outline-success" onclick="multi()">Multiplication</button>
                <button type="button" class="btn btn-outline-secondary" onclick="div()">Division</button>
            </div>
        </main>

        </footer>
